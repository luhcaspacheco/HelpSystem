# Porta da API
server.port=8080
spring.application.name=HelpSystem

# ---- Conexão com o banco (Spring Data JPA / Hibernate) ----
spring.datasource.url=jdbc:mysql://localhost:3306/help_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# O banco já existe (rodamos o script SQL), então NÃO deixamos o Hibernate
# criar/alterar tabelas: apenas usamos o schema atual.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
